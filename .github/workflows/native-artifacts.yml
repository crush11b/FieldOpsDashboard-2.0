name: Native artifacts

on:
  push:
    branches: [main, feature/2.4-field-tools-coordinate-workspace, feature/2.7-connected-operations]
  workflow_dispatch:
    inputs:
      source_revision:
        description: 'Exact checked-out commit SHA to publish'
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Provision and verify P.533 runtime
        shell: pwsh
        run: |
          npm ci
          npm run p533:provision
          npm run p533:verify
      - name: Restore, build, and test
        run: dotnet test agent/FieldOps.Agent.sln --configuration Release
      - name: Publish native artifacts
        shell: pwsh
        run: ./agent/scripts/Publish-FieldOpsArtifacts.ps1 -SourceRevision '${{ inputs.source_revision || github.sha }}'
      - name: Package native artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path agent/artifacts/publish/win-x64/agent,agent/artifacts/publish/win-x64/tray,agent/artifacts/publish/win-x64/artifact-manifest.json -DestinationPath fieldops-native-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fieldops-native-win-x64-${{ inputs.source_revision || github.sha }}
          path: fieldops-native-win-x64.zip
